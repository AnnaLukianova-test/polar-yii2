services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: polar-yii-php
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./app:/var/www/html/app
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      COOKIE_VALIDATION_KEY: ${COOKIE_VALIDATION_KEY}
      RATE_LIMIT_MAX_ATTEMPTS: ${RATE_LIMIT_MAX_ATTEMPTS}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW}
      POLAR_CLIENT_ID: ${POLAR_CLIENT_ID}
      POLAR_CLIENT_SECRET: ${POLAR_CLIENT_SECRET}
      POLAR_TOKEN_ENCRYPTION_KEY: ${POLAR_TOKEN_ENCRYPTION_KEY}
      POLAR_REDIRECT_URI: ${POLAR_REDIRECT_URI}
      POLAR_AUTH_URL: ${POLAR_AUTH_URL}
      POLAR_TOKEN_URL: ${POLAR_TOKEN_URL}
      POLAR_API_BASE_URL: ${POLAR_API_BASE_URL}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: polar-yii-db
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
